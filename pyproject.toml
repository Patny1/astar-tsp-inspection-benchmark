[project]
name = "astar-tsp-inspection-benchmark"
version = "1.0.0"
description = "Benchmark of six target-ordering algorithms over A* cost matrices for UAV inspection routing: code and data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Patricia Constante", email = "pnconstante@espe.edu.ec" }]
license = { text = "MIT" }
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pandas==2.3.3",
    "matplotlib==3.10.9",
    "joblib==1.5.3",
    "scikit-posthocs==0.14.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioinspired"]

